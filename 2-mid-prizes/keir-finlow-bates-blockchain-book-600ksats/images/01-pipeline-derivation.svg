<text x="960.0" y="123.0" text-anchor="middle" font-size="12" fill="#FFFFFF">= 32-byte private key</text>
<rect x="1150" y="80" width="180" height="60" rx="8" fill="#1F5FBF" stroke="#14406e" stroke-width="1.5"/>
<text x="1240.0" y="107.0" text-anchor="middle" font-size="12" fill="#FFFFFF">public key</text>
<text x="1240.0" y="123.0" text-anchor="middle" font-size="12" fill="#FFFFFF">(uncompressed, 65 bytes)</text>
