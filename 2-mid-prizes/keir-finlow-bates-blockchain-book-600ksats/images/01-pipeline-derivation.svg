<text x="1520.0" y="115.0" text-anchor="middle" font-size="12" fill="#FFFFFF">HASH160</text>
<rect x="1710" y="80" width="180" height="60" rx="8" fill="#1F5FBF" stroke="#14406e" stroke-width="1.5"/>
<text x="1800.0" y="107.0" text-anchor="middle" font-size="12" fill="#FFFFFF">P2PKH address</text>
<text x="1800.0" y="123.0" text-anchor="middle" font-size="12" fill="#FFFFFF">(version byte 0x00)</text>
<line x1="210" y1="110.0" x2="302" y2="110.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="260.0" y="98.0" text-anchor="middle" font-size="9.5" fill="#333333">sha256(utf-8 bytes)</text>
<line x1="490" y1="110.0" x2="582" y2="110.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="540.0" y="98.0" text-anchor="middle" font-size="9.5" fill="#333333">sha256(digest)</text>
<line x1="770" y1="110.0" x2="862" y2="110.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="820.0" y="98.0" text-anchor="middle" font-size="9.5" fill="#333333">sha256(digest)</text>
<line x1="1050" y1="110.0" x2="1142" y2="110.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1100.0" y="98.0" text-anchor="middle" font-size="9.5" fill="#333333">secp256k1 x G</text>
<line x1="1330" y1="110.0" x2="1422" y2="110.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1380.0" y="86.0" text-anchor="middle" font-size="9.5" fill="#333333">RIPEMD160(</text>
<text x="1380.0" y="98.0" text-anchor="middle" font-size="9.5" fill="#333333">SHA-256(pubkey))</text>
<line x1="1610" y1="110.0" x2="1702" y2="110.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1660.0" y="98.0" text-anchor="middle" font-size="9.5" fill="#333333">Base58Check</text>
