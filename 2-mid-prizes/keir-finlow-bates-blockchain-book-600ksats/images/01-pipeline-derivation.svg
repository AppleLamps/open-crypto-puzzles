<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="220" viewBox="0 0 1920 220" font-family="DejaVu Sans">
<rect x="0" y="0" width="1920" height="220" fill="#FFFFFF"/>
<rect x="30" y="80" width="180" height="60" rx="8" fill="#1F5FBF" stroke="#14406e" stroke-width="1.5"/>
