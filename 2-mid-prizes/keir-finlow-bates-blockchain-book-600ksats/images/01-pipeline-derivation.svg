<text x="120.0" y="115.0" text-anchor="middle" font-size="12" fill="#FFFFFF">(exact spelling,</text>
<text x="120.0" y="131.0" text-anchor="middle" font-size="12" fill="#FFFFFF">case-insensitive)</text>
<rect x="310" y="80" width="180" height="60" rx="8" fill="#1F5FBF" stroke="#14406e" stroke-width="1.5"/>
<text x="400.0" y="115.0" text-anchor="middle" font-size="12" fill="#FFFFFF">SHA-256 #1</text>
<rect x="590" y="80" width="180" height="60" rx="8" fill="#1F5FBF" stroke="#14406e" stroke-width="1.5"/>
