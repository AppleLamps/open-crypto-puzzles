<svg xmlns="http://www.w3.org/2000/svg" width="1530" height="260" viewBox="0 0 1530 260" font-family="DejaVu Sans">
<rect x="0" y="0" width="1530" height="260" fill="#FFFFFF"/>
<rect x="30" y="100" width="170" height="60" rx="8" fill="#1F5FBF" stroke="#14406e" stroke-width="1.5"/>
<text x="115.0" y="128.0" text-anchor="middle" font-size="11" fill="#FFFFFF">encrypted WIF</text>
<text x="115.0" y="142.0" text-anchor="middle" font-size="11" fill="#FFFFFF">6P... (printed)</text>
<rect x="290" y="100" width="170" height="60" rx="8" fill="#1F5FBF" stroke="#14406e" stroke-width="1.5"/>
<text x="375.0" y="128.0" text-anchor="middle" font-size="11" fill="#FFFFFF">passphrase</text>
<text x="375.0" y="142.0" text-anchor="middle" font-size="11" fill="#FFFFFF">XXXX-XXXX-XXXX-XXXX-XXXX</text>
<rect x="550" y="100" width="170" height="60" rx="8" fill="#1F5FBF" stroke="#14406e" stroke-width="1.5"/>
<text x="635.0" y="135.0" text-anchor="middle" font-size="11" fill="#FFFFFF">passfactor</text>
<rect x="810" y="100" width="170" height="60" rx="8" fill="#1F5FBF" stroke="#14406e" stroke-width="1.5"/>
<text x="895.0" y="135.0" text-anchor="middle" font-size="11" fill="#FFFFFF">private key</text>
<rect x="1070" y="100" width="170" height="60" rx="8" fill="#1F5FBF" stroke="#14406e" stroke-width="1.5"/>
<text x="1155.0" y="135.0" text-anchor="middle" font-size="11" fill="#FFFFFF">public key</text>
<rect x="1330" y="100" width="170" height="60" rx="8" fill="#1F5FBF" stroke="#14406e" stroke-width="1.5"/>
<text x="1415.0" y="135.0" text-anchor="middle" font-size="11" fill="#FFFFFF">P2PKH address</text>
<line x1="200" y1="130.0" x2="282" y2="130.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="245.0" y="102.0" text-anchor="middle" font-size="9" fill="#333333">+ ownerentropy</text>
<text x="245.0" y="114.0" text-anchor="middle" font-size="9" fill="#333333">(8 bytes, public)</text>
<line x1="460" y1="130.0" x2="542" y2="130.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="505.0" y="102.0" text-anchor="middle" font-size="9" fill="#333333">scrypt</text>
<text x="505.0" y="114.0" text-anchor="middle" font-size="9" fill="#333333">N=16384 r=8 p=8</text>
<line x1="720" y1="130.0" x2="802" y2="130.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="765.0" y="90.0" text-anchor="middle" font-size="9" fill="#333333">x factorb</text>
<text x="765.0" y="102.0" text-anchor="middle" font-size="9" fill="#333333">(from seedb</text>
<text x="765.0" y="114.0" text-anchor="middle" font-size="9" fill="#333333">in the 6P... blob)</text>
<line x1="980" y1="130.0" x2="1062" y2="130.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1025.0" y="114.0" text-anchor="middle" font-size="9" fill="#333333">secp256k1</text>
<line x1="1240" y1="130.0" x2="1322" y2="130.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1285.0" y="102.0" text-anchor="middle" font-size="9" fill="#333333">HASH160</text>
<text x="1285.0" y="114.0" text-anchor="middle" font-size="9" fill="#333333">+ Base58Check</text>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#333333"/></marker></defs>
</svg>